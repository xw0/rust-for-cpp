name: Report a problem
description: A mistake, an unclear explanation, a broken example or a translation issue.
title: "[Problem] "
labels: ["correction"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page, ideally with the section anchor.
      placeholder: https://xw0.github.io/rust-for-cpp/foundations/borrowing.html#...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Technical mistake
        - Unclear or confusing explanation
        - Example does not compile or run
        - Interactive diagram or widget
        - Chinese translation
        - Typo or wording
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What is wrong, and what did you expect?
      description: Quote the text if you can. If it is a C++ comparison, say which C++ behavior you had in mind. English or Chinese is fine.
    validations:
      required: true
